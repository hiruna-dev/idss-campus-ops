server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: task1-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/task1/**
        - id: task2-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/task2/**
        - id: task3-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/task3/**
        - id: task4-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/task4/**
        - id: task5-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/task5/**
